name: Main release source gate

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  main-release-source:
    name: main-release-source
    runs-on: ubuntu-latest
    steps:
      - name: Require dev into main
        env:
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "Expected pull request base branch 'main', got '$BASE_REF'." >&2
            exit 1
          fi

          if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$HEAD_REF" != "dev" ]; then
            echo "Main accepts release pull requests only from $BASE_REPO:dev." >&2
            echo "Actual source: $HEAD_REPO:$HEAD_REF -> $BASE_REPO:$BASE_REF." >&2
            exit 1
          fi

          echo "Accepted release pull request: $HEAD_REPO:$HEAD_REF -> $BASE_REPO:$BASE_REF."
